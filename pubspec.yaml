name: cb_funk
description: CB-Funk - CB-Funkgeraet als App (MQTT-VoIP)
publish_to: "none"
version: 1.2.6+26

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  mqtt_client: ^10.2.0
  typed_data: ^1.3.2
  shared_preferences: ^2.2.3
  record: ^6.2.0          # Mikrofon (PCM-Stream), Android + Windows
  flutter_soloud: ^3.1.0  # Wiedergabe von PCM-Stream, Android + Windows
  ffi: ^2.1.0             # Windows: serielle Leitung + USB-HID per Win32
  usb_serial: ^0.5.2      # Android: USB-Seriell (RTS/DTR)
  wakelock_plus: ^1.2.8   # Bildschirm/PC bei aktivem Gateway wach halten
  window_manager: ^0.5.2 # Rahmenloses Windows-Fenster und Positionierung

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
