# Baut APK + Windows-Installer automatisch auf GitHub (kein lokales Dev-Setup noetig).
name: Build CB-Funk
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        # Feste Version = gleicher Stand wie beim lokalen Bauen
        with: { channel: stable, flutter-version: 3.41.1 }
      # Der Ordner android/ ist vollstaendig im Projekt (Manifest, MainActivity mit
      # USB-HID und Hintergrund-Ton, Icons). Er wird unveraendert gebaut - frueher
      # hat dieser Schritt die MainActivity durch eine veraltete Kopie ersetzt.
      - run: flutter pub get
      - name: Tests (blockieren den Build nicht)
        run: flutter test
        continue-on-error: true
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk CB-Funk.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CB-Funk-apk
          path: CB-Funk.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        # Feste Version = gleicher Stand wie beim lokalen Bauen
        with: { channel: stable, flutter-version: 3.41.1 }
      - run: flutter create --platforms=android,windows --project-name cb_funk --org de.cbfunk .
      # Fenstername/-groesse stehen fest in windows/runner (main.cpp, Runner.rc)
      - name: Icon setzen
        shell: pwsh
        run: Copy-Item assets/icons/app_icon.ico windows/runner/resources/app_icon.ico -Force
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Installer bauen (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $v = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\cbfunk.iss
          Get-ChildItem installer\Output
      - uses: actions/upload-artifact@v4
        with:
          name: CB-Funk-Windows-Installer
          path: installer/Output/*.exe
      - name: Pruefen, ob die VC++-Laufzeit beiliegt
        shell: pwsh
        run: |
          foreach ($d in 'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll') {
            if (-not (Test-Path "build/windows/x64/runner/Release/$d")) { throw "$d fehlt im Release-Ordner" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: CB-Funk-windows-portable
          path: build/windows/x64/runner/Release
